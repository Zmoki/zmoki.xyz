pins:
  - headline: "1-for-1 Sprints for tasks you keep avoiding"
    title: "1-for-1 Sprints, a neurodivergent take on Pomodoro for tasks that feel like torture"
    description: "I had a stack of boring client reports between me and getting paid, and for three days my brain refused to start. This is executive dysfunction, and pushing harder does nothing. What worked was a 1-for-1 Sprint. 25 minutes on the boring task, then 25 minutes on something I actually wanted to do, then repeat. A neurodivergent adaptation of the Pomodoro technique that swaps the short break for an equal block of reward time. All the reports were done in under three hours. The full story and the rules are on my digital garden. ADHD productivity, executive dysfunction, task initiation, dopamine, AuDHD."
    publishDate: "2026-09-13"
    contentModifiedDate: "2026-09-13"
  - headline: "25 minutes of work, 25 minutes of reward"
    title: "ADHD productivity technique, 25 minutes of boring work earns 25 minutes of reward"
    description: "Pomodoro gives you 25 minutes of work and a 5 minute break. For my ADHD brain a 5 minute break is nowhere near enough reward to face a truly awful task. The 1-for-1 Sprint makes the reward equal to the work. Set a timer for 25 minutes, work only on the boring thing, stop when it rings, then set another 25 minutes for a high dopamine activity you are excited about. Repeat. It turns a push against an invisible wall into a pull towards something you want. On my digital garden I share how I used it to finish reports I had avoided for days. Executive dysfunction tips, ADHD time management, neurodivergent productivity."
    publishDate: "2026-09-13"
    contentModifiedDate: "2026-09-13"
  - headline: "Grandma's rule for boring tasks"
    title: "Premack's principle for ADHD, earn dopamine time with equal work and reward sprints"
    description: "Grandma's rule says eat your vegetables before dessert. Psychologists call it Premack's principle, and it is the idea behind the 1-for-1 Sprint, a technique I use for high stakes, low dopamine tasks. Equal blocks of boring work and rewarding play, timed, repeated. The trick that made it work was shrinking the work sprint to something mechanical like just type a title. My digital garden has the full write-up and why it fits a neurodivergent brain better than the classic Pomodoro. ADHD strategies, executive dysfunction, motivation, Premack principle."
    publishDate: "2026-09-13"
    contentModifiedDate: "2026-09-13"
