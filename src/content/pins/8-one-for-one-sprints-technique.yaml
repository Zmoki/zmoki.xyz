  - headline: "1-for-1 Sprints for tasks you keep avoiding"
    title: "1-for-1 Sprints, a neurodivergent take on Pomodoro for tasks that feel like torture"
    description: "I avoided a stack of boring client reports for three days. What finally worked was 25 minutes on the task, then 25 minutes on something I actually wanted to do, on repeat. All done in under three hours."
    publishDate: "2026-09-13"
    contentModifiedDate: "2026-09-13"
