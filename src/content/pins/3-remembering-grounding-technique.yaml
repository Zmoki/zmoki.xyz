  - headline: "5-4-3-2-1 grounding technique cheat sheet"
    title: "5-4-3-2-1 grounding technique cheat sheet for anxiety and sensory overload"
    description: "The 5-4-3-2-1 grounding technique is a five step sensory scan that pulls you out of spiraling thoughts. Name five things you can see, four you can feel, three you can hear, two you can smell, one you can taste. Simple on paper. In the middle of an anxiety storm my mind goes blank after item one, so I made myself a cheat sheet, a short video that works as a visual mnemonic. It lives on my digital garden, free to use. Grounding exercises, anxiety tools, emotional dysregulation, neurodivergent coping skills."
    publishDate: "2026-09-13"
    contentModifiedDate: "2026-09-13"
  - headline: "See 5, feel 4, hear 3, smell 2, taste 1"
    title: "How to remember the 5-4-3-2-1 grounding technique when your mind goes blank"
    description: "Grounding only helps if you can remember the steps while your internal world is a storm. I live with an anxiety disorder and emotional dysregulation, and forgetting the sequence used to turn the volume up inside my head. My memory works in visuals and sequences, so I built a looping video from my own photographs, one word per sense. Now I play it in my mind instead of struggling to recall the list. The video and the full five steps are on my digital garden. Anxiety relief, panic attack tools, mindfulness for ADHD, sensory grounding."
    publishDate: "2026-09-13"
    contentModifiedDate: "2026-09-13"
  - headline: "A grounding video I made for my brain"
    title: "A visual mnemonic video for grounding, made for a neurodivergent brain"
    description: "Sometimes the most effective tools are the ones we redesign for ourselves. The standard 5-4-3-2-1 grounding exercise never stuck for me, so I turned it into a short video, each sense layered over a piece of my own art. The sky for sight, the ripples of the sea for sound. It is a file I saved directly to my brain, and it brings me back to the present moment when anxiety hits. Watch it and read the story on my digital garden. Neurodivergent tools, anxiety coping strategies, grounding techniques, mental health."
    publishDate: "2026-09-13"
    contentModifiedDate: "2026-09-13"
