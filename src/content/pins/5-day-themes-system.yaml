pins:
  - headline: "Day Themes instead of to-do lists"
    title: "Day Themes system, a neurodivergent-friendly alternative to to-do lists"
    description: "I have been at war with the to-do list for as long as I can remember. One list with personal life, freelance work, and startup ideas mixed together is a recipe for overwhelm, and bullet journals and task apps all became another chore. Day Themes is what finally stuck. Each morning I pick one primary theme for the day, like Client Focus, Create, or Recharge, and let my energy decide the rest. Rule zero is that it is a guide, not a cage. The whole system and how I got there are on my digital garden. ADHD planning, neurodivergent productivity, daily planning without burnout."
    publishDate: "2026-09-13"
    contentModifiedDate: "2026-09-13"
  - headline: "One theme per day is enough"
    title: "ADHD planning with Day Themes, pick one theme each morning and follow your energy"
    description: "Time blocking worked for me for a few months, then managing every hour became its own chore. So I zoomed out. Instead of managing hours I manage intention. My Day Themes menu has nine themes covering every area of life, from Amplify Day for content to Life Admin Day for bills and paperwork to Decompress Day for guilt-free rest. Neurodivergent brains thrive when they can pivot inside a flexible boundary, and this gives me exactly that. Read how the system works on my digital garden. ADHD time management, energy based planning, executive function support."
    publishDate: "2026-09-13"
    contentModifiedDate: "2026-09-13"
  - headline: "Free Notion template for Day Themes"
    title: "Free Notion template, a Day Themes menu for planning days by energy and intention"
    description: "The complete Day Themes system from my digital garden as a free Notion template. A menu of themes for your days, a daily log linked to them, and room to customise everything. Built for a brain that finds rigid schedules exhausting and needs the freedom to switch tasks within a theme. Grab the template and read the story of the failed to-do lists and bullet journals that led to it. Notion templates for ADHD, neurodivergent planning, personal operating system."
    publishDate: "2026-09-13"
    contentModifiedDate: "2026-09-13"
